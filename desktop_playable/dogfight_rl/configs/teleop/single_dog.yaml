map:
  name: test_map
  boundary_walls: true
  spawn_index: 0
robot: dog_a
robots:
  dog_a: configs/robots/dog_a_teleop.yaml
teleop:
  forward_speed: 0.25
  backward_speed: 0.25
  yaw_rate: 0.3
  command_smoothing: true
  smoothing_time: 0.15
  input_timeout: 0.8
laser:
  enabled: true
  always_visible: true
  raycast_enabled: true
  damage_enabled: false
  max_range: 3.0
  radius: 0.006
first_person:
  enabled: true
  resolution: [640, 360]
  offset: [0.22, 0.0, 0.16]
  horizontal_fov_deg: 85.0
  pitch_deg: -6.0
  position_smoothing: 0.06
  yaw_smoothing: 0.08
  right_fraction: 0.34
  hide_editors: true
